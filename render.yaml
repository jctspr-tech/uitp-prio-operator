# Deploy this directory as the root of its own Git repository.
# Static sites have no compute plan; do not add plan: free or a startCommand.
services:
  - type: web
    name: priobank-operator-prototype
    runtime: static
    buildCommand: node --check dist/app.js && node --check dist/knowledge.js
    staticPublishPath: dist
    autoDeployTrigger: off
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Cache-Control
        value: "no-cache"
