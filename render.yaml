services:
  - type: web
    runtime: static
    name: uitp-prio-ai
    branch: ai-live
    buildCommand: node build.mjs
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
